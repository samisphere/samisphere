name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-lavender.svg?color_snake=D0B7E8&color_dots=1b1527,4a3868,7a5ca3,a98bd0,D0B7E8&color_dot_border=00000000

      - uses: crazy-max/github-pages-deploy-action@v4
        with:
          branch: output
          folder: dist
